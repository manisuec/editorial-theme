{{ define "main" }}
<div class="container archive">
    <header class="post-header archive-header">
        <p class="section-label"><a href="{{ printf "%s/" .Data.Plural | relURL }}">{{ .Data.Plural | humanize }}</a></p>
        <h1 class="post-title">{{ if eq .Data.Plural "tags" }}#{{ end }}{{ .Title }}</h1>
        <p class="hero-subtitle">{{ len .Pages }} {{ if eq (len .Pages) 1 }}article{{ else }}articles{{ end }}</p>
    </header>

    {{ partial "post-rows.html" (dict "pages" .Pages) }}
</div>
{{ end }}
